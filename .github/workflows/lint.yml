name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate devcontainer.json
        run: |
          set -euo pipefail
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          echo "devcontainer.json: OK"

      - name: Require image pin form
        run: |
          set -euo pipefail
          grep -q 'ghcr.io/xgic/payload-cms-dev' .devcontainer/devcontainer.json
          echo "image pin references producer GHCR package"
