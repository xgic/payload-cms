name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate devcontainer.json
        run: |
          set -euo pipefail
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          echo "devcontainer.json: OK"

      - name: Require Compose-first Dev Container
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
          if "image" in data:
              raise SystemExit("standalone image is not allowed; use dockerComposeFile + service")
          compose = data.get("dockerComposeFile")
          if compose not in ("./docker-compose.yml", "docker-compose.yml", ["./docker-compose.yml"]):
              raise SystemExit(f"unexpected dockerComposeFile: {compose!r}")
          if data.get("service") != "xgic-payload-cms-dev":
              raise SystemExit(f"unexpected service: {data.get('service')!r}")
          if data.get("workspaceFolder") != "/workspace":
              raise SystemExit(f"unexpected workspaceFolder: {data.get('workspaceFolder')!r}")
          if data.get("remoteUser") != "node":
              raise SystemExit(f"unexpected remoteUser: {data.get('remoteUser')!r}")
          run_services = data.get("runServices") or []
          if "postgres" not in run_services:
              raise SystemExit("runServices must include postgres so Reopen starts the DB")
          print("devcontainer.json Compose-first contract: OK")
          PY

      - name: Require image pin on Compose service
        run: |
          set -euo pipefail
          grep -q 'image: ghcr.io/xgic/payload-cms-dev:' .devcontainer/docker-compose.yml
          grep -q 'name: xgic-payload-cms-dev' .devcontainer/docker-compose.yml
          echo "compose image pin and project name reference producer contract"

      - name: Validate Compose file
        env:
          POSTGRES_PASSWORD: ci
        run: |
          set -euo pipefail
          docker compose -f .devcontainer/docker-compose.yml config --quiet
          echo "docker compose config: OK"
