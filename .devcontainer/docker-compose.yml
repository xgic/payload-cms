# Consumer Compose for the thin payload-cms template.
# - Dev Containers: reopen uses the pinned `image` in devcontainer.json (pull-only).
# - CLI / CI / ephemeral staging: `xgic up --profile postgres` (or mongodb) starts DB sidecars.
# - No production hosts, secrets, or deploy targets — generic local shape only.
name: xgic-payload-cms-dev

services:
  xgic-payload-cms-dev:
    image: ghcr.io/xgic/payload-cms-dev:0.3.0
    command: tail -f /dev/null
    container_name: xgic-payload-cms-dev
    env_file: .env
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - vscode-srv-ext:/home/node/.vscode-server/extensions

  postgres:
    container_name: xgic-payload-cms-dev-postgres
    env_file: .env
    image: postgres:18.4
    networks:
      - app-network
    profiles:
      - postgres
    volumes:
      - postgres-data:/var/lib/postgresql

  mongodb:
    container_name: xgic-payload-cms-dev-mongodb
    image: mongo:7.0
    networks:
      - app-network
    profiles:
      - mongodb
    volumes:
      - mongodb-data:/data/db

volumes:
  postgres-data:
    name: xgic-payload-cms-dev-postgres-data
  mongodb-data:
    name: xgic-payload-cms-dev-mongodb-data
  vscode-srv-ext:
    name: xgic-payload-cms-dev-vscode-srv-ext

networks:
  app-network:
    driver: bridge
    name: xgic-payload-cms-dev
