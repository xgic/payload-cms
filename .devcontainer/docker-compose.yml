# Thin-template Dev Container Docker Compose (localhost only).
# VS Code attaches via dockerComposeFile + service (not a standalone image container).
# Default project name: xgic-payload-cms-dev — rename name:, container_name values,
# volume names, network, XGIC_COMPOSE_PROJECT, and composeProjectName together.
name: xgic-payload-cms-dev

services:
  # Primary Dev Container service (VS Code "service" target).
  # Keep the service key as xgic-payload-cms-dev for modular XGIC CLI defaults.
  xgic-payload-cms-dev:
    image: ghcr.io/xgic/payload-cms-dev:0.3.4
    # Root so the image entrypoint can chown ssh-home and align docker-sock
    # GID. Git DX lives in the image (/usr/local/lib/xgic/git-dx), not this
    # repo. This command only chowns template named volumes, then keep-alive
    # as node. Do not put Git DX in devcontainer.json lifecycle hooks.
    user: "0:0"
    command:
      - /bin/bash
      - -lc
      - |
        set -uo pipefail
        for d in /workspace/node_modules /workspace/.next; do
          if [ -d "$$d" ] && [ "$$(stat -c %u "$$d" 2>/dev/null)" != "1000" ]; then
            chown -R 1000:1000 "$$d" || true
          fi
        done
        exec runuser -u node -- tail -f /dev/null
    container_name: xgic-payload-cms-dev
    env_file:
      - path: .env
        required: false
    environment:
      XGIC_COMPOSE_PROJECT: xgic-payload-cms-dev
      XGIC_COMPOSE_FILE: .devcontainer/docker-compose.yml
      XGIC_PRIMARY_SERVICE: xgic-payload-cms-dev
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume for ~/.ssh (known_hosts; optional manual keys). Do NOT
      # bind-mount host $HOME/.ssh. Prefer HTTPS + VS Code credential helper,
      # or the optional docker-compose.git-dx.yml SSH agent overlay.
      - ssh-home:/home/node/.ssh
      - vscode-srv-ext:/home/node/.vscode-server/extensions
      # Named volumes for node_modules/.next on bind-mounted workspaces
      # (see docs/dev-performance.md).
      - app-node-modules:/workspace/node_modules
      - app-next:/workspace/.next
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 5s

  # Always-on for the default template path (postgres adapter).
  # Mongo stays profiled for the optional CLI switch (`--profile mongodb`).
  # Only POSTGRES_* — do not env_file app secrets onto this service.
  postgres:
    container_name: xgic-payload-cms-dev-postgres
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: ${POSTGRES_DB:-payload_db}
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s

  mongodb:
    container_name: xgic-payload-cms-dev-mongodb
    image: mongo:7.0
    networks:
      - app-network
    profiles:
      - mongodb
    volumes:
      - mongodb-data:/data/db

volumes:
  postgres-data:
    name: xgic-payload-cms-dev-postgres-data
  mongodb-data:
    name: xgic-payload-cms-dev-mongodb-data
  vscode-srv-ext:
    name: xgic-payload-cms-dev-vscode-srv-ext
  app-node-modules:
    name: xgic-payload-cms-dev-node-modules
  app-next:
    name: xgic-payload-cms-dev-next
  ssh-home:
    name: xgic-payload-cms-dev-ssh-home

networks:
  app-network:
    driver: bridge
    name: xgic-payload-cms-dev
