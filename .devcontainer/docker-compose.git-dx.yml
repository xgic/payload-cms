# Optional / advanced: Docker Desktop host SSH agent sock.
# Not used by default reopen (devcontainer.json attaches only docker-compose.yml).
# Prefer HTTPS + VS Code host credential helper for github.com.
#
# Enable only when /run/host-services/ssh-auth.sock is a real socket on the
# Docker engine (never on plain Linux Engine — missing path creates a directory).
#
# Example:
#   COMPOSE_FILE=.devcontainer/docker-compose.yml:.devcontainer/docker-compose.git-dx.yml
#
# Default reopen does not include this file. Linux Engine hosts stay on HTTPS.

services:
  xgic-payload-cms-dev:
    environment:
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
